name: Static Analysis
on:
  workflow_call:
    inputs:
      qt-version:
        type: string
        required: true
      qt-modules:
        type: string
        required: true
      clang-version:
        type: string
        required: true
env:
  QT_VERSION: ${{ inputs.qt-version }}
  QT_MODULES: ${{ inputs.qt-modules }}
  CLANG_VERSION: ${{ inputs.clang-version }}

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Tools
      run: |
        scripts/install-llvm.sh ${{ env.CLANG_VERSION }} clang-tidy-${{ env.CLANG_VERSION }}
    - name: Checkout ctcache
      uses: actions/checkout@v7
      with:
        repository: matus-chochlik/ctcache
        path: ctcache
    - name: Install ctcache
      run: |
        sudo mv ctcache /opt/ctcache
    - name: Get Date
      id: get-date
      run: |
        echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
      shell: bash
    - name: Store ctcache
      uses: actions/cache@v6
      with:
        key: ctcache-${{ steps.get-date.outputs.date }}
        path: /tmp/clang-tidy-cache
        restore-keys: |
          ctcache-
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - uses: actions/download-artifact@v8
      with:
        name: static-analysis-build
        path: build/clang/
    - name: Analyse
      run: scripts/clang-tidy.sh
      env:
        CLANG_TIDY: /opt/ctcache/clang-tidy
        CTCACHE_DIR: /tmp/clang-tidy-cache
        CTCACHE_CLANG_TIDY: clang-tidy-${{ env.CLANG_VERSION }}
        CTCACHE_SAVE_OUTPUT: 1
        BUILD_DIR: build/clang/
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-clang-tidy-logs
        path: build/clang/*.log

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Tools
      run: |
        scripts/install-llvm.sh ${{ env.CLANG_VERSION }} cppcheck
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - uses: actions/download-artifact@v8
      with:
        name: static-analysis-build
        path: build/clang/
    - name: Analyse
      run: scripts/cppcheck.sh
      env:
        CPPCHECK: cppcheck
        BUILD_DIR: build/clang/
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-cppcheck-logs
        path: build/clang/*.log

  clazy:
    name: Clazy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Tools
      run: |
        scripts/install-llvm.sh ${{ env.CLANG_VERSION }} clang llvm-${{ env.CLANG_VERSION }}-dev libclang-${{ env.CLANG_VERSION }}-dev
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - uses: actions/checkout@v7
      with:
        repository: KDE/clazy
        # v1.17.1 crashes on compare-member-check; the fix is not in any release yet
        ref: 4100430ff3a0cb9fe75f8b2ff6b282843e6c004b
        path: clazy
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: clazy
        install: binary
    - name: Build clazy
      run: |
        cd clazy/
        sed -i 's/target_precompile_headers/#target_precompile_headers/' CMakeLists.txt
        cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DLLVM_CONFIG_EXECUTABLE=/usr/bin/llvm-config-${{ env.CLANG_VERSION }} \
          -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build .
        sudo cmake --build . --target install
    - uses: actions/download-artifact@v8
      with:
        name: static-analysis-build
        path: build/clang/
    - name: Analyse
      run: scripts/clazy.sh
      env:
        CLAZY: /usr/bin/clazy
        BUILD_DIR: build/clang/
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-clazy-logs
        path: build/clang/*.log

  qmllint:
    name: QML Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - uses: actions/download-artifact@v8
      with:
        name: static-analysis-build
        path: build/clang/
    - name: Analyse
      run: scripts/qmllint.sh
      env:
        BUILD_DIR: build/clang/
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-qmllint-logs
        path: build/clang/*.log

  iwyu:
    name: IWYU
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Tools
      run: |
        scripts/install-llvm.sh ${{ env.CLANG_VERSION }} clang llvm-${{ env.CLANG_VERSION }}-dev libclang-${{ env.CLANG_VERSION }}-dev
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - uses: actions/checkout@v7
      with:
        repository: include-what-you-use/include-what-you-use
        ref: clang_${{ env.CLANG_VERSION }}
        path: iwyu
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: iwyu
        install: binary
    - name: Build IWYU
      run: |
        cd iwyu/
        cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-${{ env.CLANG_VERSION }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build .
        sudo cmake --build . --target install
    - uses: actions/download-artifact@v8
      with:
        name: static-analysis-build
        path: build/clang/
    - name: Analyse
      run: scripts/iwyu.sh
      env:
        BUILD_DIR: build/clang/
        IWYU_SOURCE: ${{ github.workspace }}/iwyu
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-iwyu-logs
        path: build/clang/*.log

  prereleasestaticanalysislogs:
    if: github.event_name != 'pull_request'
    name: Upload Logs
    runs-on: ubuntu-latest
    needs:
      - clang-tidy
      - cppcheck
      - clazy
      - iwyu
      - qmllint
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: static-analysis-*-logs
        merge-multiple: true
        path: prerelease/Static Analysis Logs
    - uses: horochx/deploy-via-scp@master
      with:
        host: ${{ secrets.PRERELEASE_HOST }}
        user: ${{ secrets.PRERELEASE_USERNAME }}
        key: ${{ secrets.PRERELEASE_KEY }}
        local: "prerelease/*"
        remote: ${{ secrets.PRERELEASE_DIR }}
