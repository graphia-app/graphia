name: Build
on: [push, pull_request]
env:
  QT_VERSION: 6.11.2
  QT_MODULES: qtwebengine qtwebchannel qtpositioning qtimageformats
  # Qt 6.11 splits the Windows repository into per-compiler folders; support
  # for this is not in an aqtinstall release yet, so pin to a commit that has it
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4
  GCC_VERSION: 14
  CLANG_VERSION: 19

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Tools
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt install gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} mold
    - name: Install Dependencies
      run: sudo apt install libxcb-cursor0
    - name: Install Qt
      uses: ./.github/actions/install-qt
      with:
        # linuxdeploy bundles Qt Positioning's NMEA plugin, which links Qt Serial Port
        extra-modules: qtserialport
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: linux
        install: binary
    - name: Compile
      run: scripts/linux-build.sh
      env:
        CC: gcc-${{ env.GCC_VERSION }}
        CXX: g++-${{ env.GCC_VERSION }}
    - name: Test
      run: ctest --test-dir build/gcc --output-on-failure
    - name: AppImage
      run: |
        installers/linux/build.sh
      env:
        CC: gcc-${{ env.GCC_VERSION }}
        CXX: g++-${{ env.GCC_VERSION }}
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: linux-appimage
        path: build/gcc/Graphia-*.tar.gz
    - uses: actions/upload-artifact@v7
      with:
        name: linux-logs
        path: build/gcc/*.log
    - name: Upload Symbols
      if: github.event_name != 'pull_request'
      run: scripts/upload-symbols.sh
      shell: bash
      env:
        SYM_UPLOAD_URL: ${{ secrets.SYM_UPLOAD_URL }}

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    needs:
      - check-is-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            id: windows
            compiler: cl.exe
          - name: Windows Clang
            id: windows-clang
            compiler: clang-cl.exe
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ matrix.id }}
        install: binary
    - name: Compile
      shell: pwsh
      run: . .\scripts\windows-build.ps1
      env:
        CC: ${{ matrix.compiler }}
        CXX: ${{ matrix.compiler }}
    - name: Test
      shell: pwsh
      run: ctest --test-dir build --output-on-failure
    - name: Sign Executables
      if: needs.check-is-release.outputs.is-release == 'true'
      uses: ./.github/actions/sign
      with:
        artifact-name: ${{ matrix.id }}-unsigned-exes
        path: |
          build/CrashReporter.exe
          build/Graphia.exe
          build/MessageBox.exe
          build/Updater.exe
          build/plugins/*.dll
        output-directory: build
        api-token: ${{ secrets.WINDOWS_SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.WINDOWS_SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ secrets.WINDOWS_SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ secrets.WINDOWS_SIGNPATH_SIGNING_POLICY_SLUG }}
    - name: Prepare NSIS Installer
      shell: pwsh
      run: .\installers\windows\prepare-installer.ps1
    - name: Sign Uninstaller
      if: needs.check-is-release.outputs.is-release == 'true'
      uses: ./.github/actions/sign
      with:
        artifact-name: ${{ matrix.id }}-unsigned-uninstaller
        path: installer/Uninstall.exe
        output-directory: installer
        api-token: ${{ secrets.WINDOWS_SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.WINDOWS_SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ secrets.WINDOWS_SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ secrets.WINDOWS_SIGNPATH_SIGNING_POLICY_SLUG }}
    - name: Make NSIS Installer
      shell: pwsh
      run: .\installers\windows\make-installer.ps1
    - name: Sign Installer
      if: needs.check-is-release.outputs.is-release == 'true'
      uses: ./.github/actions/sign
      with:
        artifact-name: ${{ matrix.id }}-unsigned-installer
        path: installer/*-installer.exe
        output-directory: installer
        api-token: ${{ secrets.WINDOWS_SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.WINDOWS_SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ secrets.WINDOWS_SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ secrets.WINDOWS_SIGNPATH_SIGNING_POLICY_SLUG }}
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: ${{ matrix.id }}-installer
        path: installer/Graphia-*-installer.exe
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.id }}-logs
        path: build/*.log
    - name: Upload Symbols
      if: github.event_name != 'pull_request'
      run: scripts/upload-symbols.sh
      shell: bash
      env:
        SYM_UPLOAD_URL: ${{ secrets.SYM_UPLOAD_URL }}

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: macos
        install: binary
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Compile
      run: scripts/macos-build.sh
    - name: Test
      run: ctest --test-dir build --output-on-failure
    - name: app and dmg
      run: |
        npm install -g appdmg
        installers/macos/build.sh
      env:
        APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_CERTIFICATE_ID: ${{ secrets.APPLE_CERTIFICATE_ID }}
        APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: macos-disk-image
        path: build/Graphia-*.dmg
    - uses: actions/upload-artifact@v7
      with:
        name: macos-logs
        path: build/*.log
    - name: Upload Symbols
      if: github.event_name != 'pull_request'
      run: scripts/upload-symbols.sh
      shell: bash
      env:
        SYM_UPLOAD_URL: ${{ secrets.SYM_UPLOAD_URL }}

  macos-sanitizers:
    name: macOS Sanitizers
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: macos-sanitizers
        install: binary
    - name: Compile
      run: scripts/macos-build.sh
      env:
        BUILD_TYPE: Debug
        SANITIZERS: address;undefined
        OSX_ARCHITECTURES: arm64
    - name: Test
      run: ctest --test-dir build --output-on-failure
      env:
        UBSAN_OPTIONS: print_stacktrace=1
    - uses: actions/upload-artifact@v7
      with:
        name: macos-sanitizers-logs
        path: build/*.log

  windows-asan:
    name: Windows ASan
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: windows-asan
        install: binary
    - name: Compile
      shell: pwsh
      run: . .\scripts\windows-build.ps1
      env:
        SANITIZERS: address
        CC: cl.exe
        CXX: cl.exe
    - name: Test
      shell: pwsh
      run: |
        . .\scripts\enter-vs-dev-shell.ps1
        ctest --test-dir build --output-on-failure
    - uses: actions/upload-artifact@v7
      with:
        name: windows-asan-logs
        path: build/*.log

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Determine appropriate emsdk version
      run: |
        EMSDK_VERSION=$(scripts/emsdk-version-for-qt-version.sh ${{ env.QT_VERSION }})
        echo "EMSDK_VERSION=${EMSDK_VERSION}" >> $GITHUB_ENV
    - name: Install emsdk
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: ${{ env.EMSDK_VERSION }}
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtsource: ${{ env.AQT_SOURCE }}
        version: ${{ env.QT_VERSION }}
        host: all_os
        target: wasm
        arch: wasm_multithread
        extra: --autodesktop
        cache: true
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: wasm
        install: binary
    - name: Compile
      run: |
        scripts/wasm-build.sh
      env:
        UNITY_BUILD: OFF
    - name: Archive
      run: |
        installers/wasm/build.sh
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: webassembly
        path: build/wasm/Graphia-WebAssembly-*
    - uses: actions/upload-artifact@v7
      with:
        name: webassembly-logs
        path: build/wasm/*.log

  clang-debug:
    name: Clang Debug
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Tools
      run: |
        scripts/install-llvm.sh ${{ env.CLANG_VERSION }} mold
    - name: Install Qt
      uses: ./.github/actions/install-qt
    - name: ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: clang-debug
        install: binary
    - name: Compile
      run: |
        scripts/linux-build.sh
        scripts/parse-compile_commands-json.sh
      env:
        BUILD_TYPE: Debug
        UNITY_BUILD: OFF
        SANITIZERS: address;undefined
        COVERAGE: ON
        STDLIB_ASSERTIONS: ON
        CC: clang-${{ env.CLANG_VERSION }}
        CXX: clang++-${{ env.CLANG_VERSION }}
    - name: Test
      run: ctest --test-dir build/clang --output-on-failure
      env:
        UBSAN_OPTIONS: print_stacktrace=1
        LLVM_PROFILE_FILE: ${{ github.workspace }}/build/clang/profiles/%m-%p.profraw
    - name: Coverage
      if: ${{ success() || failure() }}
      run: scripts/coverage.sh
      env:
        LLVM_PROFDATA: llvm-profdata-${{ env.CLANG_VERSION }}
        LLVM_COV: llvm-cov-${{ env.CLANG_VERSION }}
        BUILD_DIR: build/clang/
    - uses: actions/upload-artifact@v7
      if: ${{ success() || failure() }}
      with:
        name: coverage
        path: |
          build/clang/coverage.txt
          build/clang/coverage.lcov
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-clang-logs
        path: build/clang/*.log
    - uses: actions/upload-artifact@v7
      with:
        name: static-analysis-build
        # qmllint's arguments are in .rcc/ and resources in .qt/
        include-hidden-files: true
        path: |
          build/clang/variables.sh
          build/clang/compile_commands.json
          build/clang/**/*.h
          build/clang/**/*.hpp
          build/clang/**/*.hxx
          build/clang/**/*.c
          build/clang/**/*.cpp
          build/clang/**/*.cxx
          build/clang/**/qmldir
          build/clang/**/*.qml
          build/clang/**/*.js
          build/clang/**/*.qmltypes
          build/clang/**/*.qrc
          build/clang/**/*.moc
          build/clang/**/.rcc/qmllint/*.rsp

  static-analysis:
    name: Static Analysis
    needs:
      - workflow-env
      - clang-debug
    uses: ./.github/workflows/static-analysis.yml
    with:
      qt-version: ${{ needs.workflow-env.outputs.qt-version }}
      qt-modules: ${{ needs.workflow-env.outputs.qt-modules }}
      clang-version: ${{ needs.workflow-env.outputs.clang-version }}
    secrets: inherit

  check-is-release:
    name: Check For Release Tag
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.is-release-test.outputs.result }}
    steps:
    - name: Check Release Tag
      id: is-release-test
      run: |
        if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]
        then
          echo "Not tagged"
          echo "result=false" >> $GITHUB_OUTPUT
        elif [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
        then
          echo "'${GITHUB_REF_NAME}' is a release"
          echo "result=true" >> $GITHUB_OUTPUT
        else
          echo "'${GITHUB_REF_NAME}' is not a release"
          echo "result=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

  workflow-env:
    name: Workflow Environment
    runs-on: ubuntu-latest
    outputs:
      qt-version: ${{ env.QT_VERSION }}
      qt-modules: ${{ env.QT_MODULES }}
      clang-version: ${{ env.CLANG_VERSION }}
    steps:
    - run: echo "Qt ${QT_VERSION} (${QT_MODULES}), Clang ${CLANG_VERSION}"

  publish:
    name: Publish
    if: github.event_name != 'pull_request'
    needs:
      - check-is-release
      - linux
      - windows
      - macos
      - wasm
    uses: ./.github/workflows/publish.yml
    with:
      is-release: ${{ needs.check-is-release.outputs.is-release == 'true' }}
    secrets: inherit

  log-analysis:
    if: github.event_name != 'pull_request'
    name: Analyse Logs
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
      - macos-sanitizers
      - windows-asan
      - wasm
      - clang-debug
      - static-analysis
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        pattern: '*-logs'
        path: logs
    - name: Install Perl modules
      uses: perl-actions/install-with-cpanm@v2
      with:
        install: |
          Text::Table::CSV
          Text::Table::Tiny
    - uses: actions/checkout@v7
      with:
        repository: graphia-app/defects
        ssh-key: ${{ secrets.DEFECTS_SSH_PRIVATE_KEY }}
        path: defects
    - name: Analyse
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        MESSAGE=$(git log --format=%B -n1 HEAD | head -n1)
        BRANCH=$(echo ${GITHUB_REF#refs/*/})
        cd defects
        git config user.email ""
        git config user.name "Log Analyser"
        ./update.sh -b $BRANCH -l "../logs" -m "$SHORT_SHA $MESSAGE"
